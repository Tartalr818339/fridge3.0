<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#123D28" />
  <title>鲜知 FreshSense 3.0 · 手机 App</title>
  <link rel="stylesheet" href="./styles.css?v=60" />
</head>
<body>
  <div class="app-stage">
    <div class="phone-frame">
      <div id="app-topbar" class="app-topbar"><!-- JS renders --></div>
      <div id="app-content" class="app-content"><!-- JS renders --></div>
      <!-- 滚动提示：右侧滚动条 + 底部下滑提示 -->
      <div id="scroll-rail" class="scroll-rail" aria-hidden="true"><span></span></div>
      <div id="scroll-cue" class="scroll-cue" aria-hidden="true">下滑查看冰箱分区 <b>↓</b></div>
      <div id="dock-root" class="dock-root"></div>
      <button id="help-fab" class="help-fab" data-action="tour-restart" aria-label="重新查看新手教程">🧭<span>教程</span></button>
      <div id="app-tabbar" class="app-tabbar"><!-- JS renders --></div>
    </div>
  </div>

  <div class="app-outer-bar">
    <span class="outer-brand"><img src="./assets/logo.svg?v=5" alt="鲜知" />鲜知 FreshSense 3.0 · 手机 App</span>
    <div class="app-outer-actions">
      <span class="outer-hint">页面预览请用手机内底部导航</span>
      <button class="chip" data-app-route="nfc">碰一碰</button>
      <button class="chip" id="btn-reset">重置数据</button>
    </div>
  </div>

  <div id="modal-root"></div>
  <!-- 开场动画 / 新手引导容器：由 JS 注入内容，避免打乱主页面结构 -->
  <div id="intro-root"></div>
  <div id="tour-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="./icons.js?v=60"></script>
  <script src="./data.js?v=60"></script>
  <script src="./app.js?v=60"></script>
</body>
</html>
